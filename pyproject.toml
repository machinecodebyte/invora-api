[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invora-backend"
version = "0.1.0"
description = "Backend foundation for an AI-based demand forecasting and inventory reorder recommendation system."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.0",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "redis==8.0.1",
    "rq==2.10.0",
    "scikit-learn==1.9.0",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis==2.36.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
extend-exclude = [
    ".build-tracker",
    ".pip-tmp",
    ".pip-work",
    ".ruff_cache",
    ".tmp",
    "pytest-cache-files-*",
]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
